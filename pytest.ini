[pytest]
asyncio_mode = auto
testpaths = tests

# Put the repository root on sys.path so `tradewatch` and `api` import without
# installing the project.
#
# Without this, `python -m pytest` passes and a bare `pytest` fails — the module
# form adds the working directory to sys.path and the console script does not.
# That difference is invisible to anyone who happens to type it one way, which
# is how it survived until CI ran the other.
pythonpath = .
